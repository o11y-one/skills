name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Skill and manifest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Frontmatter, names, index sync, links, anchors and versions
        run: python3 scripts/check.py
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Validate the marketplace manifest
        run: npx -y @anthropic-ai/claude-code@2.1.296 plugin validate --strict .
      - name: Validate the plugin manifest
        run: npx -y @anthropic-ai/claude-code@2.1.296 plugin validate --strict .claude-plugin/plugin.json

  evals:
    name: Agent evals
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Mock self-check
        run: python3 evals/test_mock.py
      - name: Run every scenario
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 evals/run.py
